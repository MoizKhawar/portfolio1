<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #e0eaff 0%, #f7faff 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            margin-top: 40px;
            color: #2d89ef;
            letter-spacing: 2px;
            font-size: 2.5rem;
            font-weight: 800;
            text-shadow: 0 2px 8px #b3d1ff44;
        }
        .game-container {
            background: rgba(255,255,255,0.98);
            padding: 36px 44px 28px 44px;
            border-radius: 22px;
            box-shadow: 0 8px 32px 0 rgba(45,137,239,0.13), 0 1.5px 8px 0 rgba(0,0,0,0.07);
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2.5px solid #e0eaff;
        }
        .mode-select {
            margin-bottom: 18px;
            display: flex;
            gap: 18px;
            width: 100%;
            justify-content: center;
        }
        .mode-btn {
            background: linear-gradient(90deg, #e0eaff 0%, #b3d1ff 100%);
            color: #2d89ef;
            border: none;
            border-radius: 10px;
            padding: 12px 36px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.18s, color 0.18s, box-shadow 0.18s, transform 0.12s;
            letter-spacing: 1px;
            font-weight: 700;
            box-shadow: 0 2px 8px #b3d1ff33;
            outline: none;
            position: relative;
            z-index: 1;
            border: 2.5px solid transparent;
        }
        .mode-btn.selected {
            background: linear-gradient(90deg, #2d89ef 0%, #1761a0 100%);
            color: #fff;
            font-weight: bold;
            box-shadow: 0 4px 16px #2d89ef33;
            border: 2.5px solid #2d89ef;
            transform: scale(1.07);
        }
        .mode-btn:focus {
            outline: 2.5px solid #2d89ef;
            outline-offset: 2px;
        }
        .mode-btn:not(.selected):hover {
            background: linear-gradient(90deg, #b3d1ff 0%, #e0eaff 100%);
            color: #1761a0;
            box-shadow: 0 4px 16px #2d89ef22;
            transform: scale(1.04);
        }
        .mode-label {
            display: block;
            text-align: center;
            font-size: 1.08rem;
            color: #2d89ef;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 1px;
            min-height: 24px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 14px;
            margin-bottom: 28px;
            background: #b3d1ff33;
            border-radius: 16px;
            box-shadow: 0 2px 12px #b3d1ff22;
            padding: 12px;
        }
        .cell {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #f0f6ff 0%, #e0eaff 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: #2d89ef;
            cursor: pointer;
            transition: background 0.18s, color 0.18s, box-shadow 0.18s;
            box-shadow: 0 2px 8px #b3d1ff22;
            user-select: none;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-weight: 700;
            border: 2.5px solid #e0eaff;
            position: relative;
            overflow: hidden;
        }
        .cell .mark {
            display: inline-block;
            animation: pop 0.22s cubic-bezier(.68,-0.55,.27,1.55);
        }
        @keyframes pop {
            0% { transform: scale(0.2); opacity: 0; }
            80% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); }
        }
        .cell:hover {
            background: linear-gradient(135deg, #e0eaff 0%, #b3d1ff 100%);
            box-shadow: 0 4px 16px #2d89ef22;
        }
        .cell.winner {
            background: linear-gradient(135deg, #d1ffd6 0%, #b3ffd1 100%);
            color: #27ae60;
            font-weight: bold;
            box-shadow: 0 0 24px 6px #27ae6044, 0 4px 16px #27ae6033;
            border: 2.5px solid #27ae60;
            animation: winner-glow 0.7s cubic-bezier(.68,-0.55,.27,1.55) 1;
        }
        @keyframes winner-glow {
            0% { box-shadow: 0 0 0 0 #27ae6044; }
            60% { box-shadow: 0 0 32px 12px #27ae6044; }
            100% { box-shadow: 0 0 24px 6px #27ae6044; }
        }
        .cell:after {
            content: '';
            display: block;
            position: absolute;
            inset: 0;
            border-radius: 16px;
            pointer-events: none;
            transition: box-shadow 0.18s;
        }
        .cell:active {
            box-shadow: 0 1px 4px #2d89ef22;
        }
        .status {
            font-size: 1.22rem;
            margin-bottom: 18px;
            color: #2d89ef;
            min-height: 28px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .reset-btn {
            background: linear-gradient(90deg, #2d89ef 0%, #1761a0 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 36px;
            font-size: 1.08rem;
            cursor: pointer;
            transition: background 0.18s, box-shadow 0.18s;
            margin-top: 18px;
            letter-spacing: 1px;
            font-weight: 700;
            box-shadow: 0 2px 8px #2d89ef33;
        }
        .reset-btn:hover {
            background: linear-gradient(90deg, #1761a0 0%, #2d89ef 100%);
            box-shadow: 0 4px 16px #2d89ef33;
        }
        .reset-btn:focus {
            outline: 2.5px solid #2d89ef;
            outline-offset: 2px;
        }
        @media (max-width: 500px) {
            .game-container {
                padding: 16px 4px 12px 4px;
            }
            .board {
                grid-template-columns: repeat(3, 60px);
                grid-template-rows: repeat(3, 60px);
                gap: 8px;
                padding: 6px;
            }
            .cell {
                width: 60px;
                height: 60px;
                font-size: 2rem;
                border-radius: 10px;
            }
        }
    </style>

</head>
<body>
    <script type="text/javascript">
	atOptions = {

</script>
<script type="text/javascript" src="//www.highperformanceformat.com/b4d6168f20fc0a90ea00c93ef46af95f/invoke.js"></script>
    <h1>Tic Tac Toe</h1>
    <div class="game-container">
        <div class="mode-label" id="modeLabel">Mode: 2 Players</div>
        <div class="mode-select">
            <button class="mode-btn selected" id="twoPlayerBtn">2 Players</button>
            <button class="mode-btn" id="vsComputerBtn">Vs Computer</button>
        </div>
        <div class="status" id="status"></div>
        <div class="board" id="board"></div>
        <button class="reset-btn" id="resetBtn">Restart Game</button>
    </div>
    <script>
        const boardElem = document.getElementById('board');
        const statusElem = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const twoPlayerBtn = document.getElementById('twoPlayerBtn');
        const vsComputerBtn = document.getElementById('vsComputerBtn');
        const modeLabel = document.getElementById('modeLabel');

        let board = Array(9).fill('');
        let currentPlayer = 'X';
        let gameActive = true;
        let winnerCells = [];
        let mode = '2p'; // '2p' or 'cpu'

        function renderBoard() {
            boardElem.innerHTML = '';
            board.forEach((cell, idx) => {
                const cellElem = document.createElement('div');
                cellElem.className = 'cell';
                if (winnerCells.includes(idx)) cellElem.classList.add('winner');
                if (cell) {
                    const mark = document.createElement('span');
                    mark.className = 'mark';
                    mark.textContent = cell;
                    cellElem.appendChild(mark);
                }
                cellElem.addEventListener('click', () => handleCellClick(idx));
                boardElem.appendChild(cellElem);
            });
        }

        function handleCellClick(idx) {
            if (!gameActive || board[idx]) return;
            board[idx] = currentPlayer;
            checkGameStatus();
            renderBoard();
            if (gameActive) {
                if (mode === '2p') {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    statusElem.textContent = `Player ${currentPlayer}'s turn`;
                } else if (mode === 'cpu') {
                    statusElem.textContent = "Computer's turn...";
                    setTimeout(() => {
                        computerMove();
                    }, 400);
                }
            }
        }

        function computerMove() {
            if (!gameActive) return;
            // Simple AI: pick random empty cell
            const emptyCells = board.map((cell, idx) => cell === '' ? idx : null).filter(idx => idx !== null);
            if (emptyCells.length === 0) return;
            // Optionally: block win or win if possible (simple logic)
            let move = findBestMove('O') || findBestMove('X') || emptyCells[Math.floor(Math.random() * emptyCells.length)];
            board[move] = 'O';
            checkGameStatus();
            renderBoard();
            if (gameActive) {
                currentPlayer = 'X';
                statusElem.textContent = `Player X's turn`;
            }
        }

        // Try to win or block
        function findBestMove(player) {
            const winPatterns = [
                [0,1,2],[3,4,5],[6,7,8],
                [0,3,6],[1,4,7],[2,5,8],
                [0,4,8],[2,4,6]
            ];
            for (const pattern of winPatterns) {
                const [a,b,c] = pattern;
                const cells = [board[a], board[b], board[c]];
                if (cells.filter(cell => cell === player).length === 2 && cells.includes('')) {
                    return pattern[cells.indexOf('')];
                }
            }
            return null;
        }

        function checkGameStatus() {
            const winPatterns = [
                [0,1,2],[3,4,5],[6,7,8],
                [0,3,6],[1,4,7],[2,5,8],
                [0,4,8],[2,4,6]
            ];
            for (const pattern of winPatterns) {
                const [a,b,c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    gameActive = false;
                    winnerCells = pattern;
                    statusElem.textContent = `Player ${board[a]} wins! 🎉`;
                    return;
                }
            }
            if (!board.includes('')) {
                gameActive = false;
                statusElem.textContent = "It's a draw!";
            }
        }

        function resetGame() {
            board = Array(9).fill('');
            currentPlayer = 'X';
            gameActive = true;
            winnerCells = [];
            statusElem.textContent = `Player ${currentPlayer}'s turn`;
            renderBoard();
        }

        function setMode(newMode) {
            mode = newMode;
            twoPlayerBtn.classList.toggle('selected', mode === '2p');
            vsComputerBtn.classList.toggle('selected', mode === 'cpu');
            modeLabel.textContent = mode === '2p' ? 'Mode: 2 Players' : 'Mode: Vs Computer';
            resetGame();
        }

        twoPlayerBtn.addEventListener('click', () => setMode('2p'));
        vsComputerBtn.addEventListener('click', () => setMode('cpu'));
        resetBtn.addEventListener('click', resetGame);

        // Initial render
        setMode('2p');
    </script>
    
    
</body>
</html>
