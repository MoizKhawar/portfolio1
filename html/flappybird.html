<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flappy Bird Clone</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #4ec0ca 0%, #1e528e 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #gameContainer {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border-radius: 20px;
            overflow: hidden;
            background: #87ceeb;
        }
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #aeefff 0%, #87ceeb 100%);
            border-radius: 20px;
        }
        #score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 8px #333;
            z-index: 2;
            pointer-events: none;
            letter-spacing: 2px;
        }
        #restartBtn {
            display: none;
            position: absolute;
            left: 50%;
            top: 60%;
            transform: translate(-50%, -50%);
            padding: 16px 40px;
            font-size: 1.5em;
            background: linear-gradient(90deg, #ffb347 0%, #ffcc33 100%);
            color: #333;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        #restartBtn:hover {
            background: linear-gradient(90deg, #ffcc33 0%, #ffb347 100%);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="score">0</div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <button id="restartBtn">Restart</button>
    </div>
    <script>
        // Game constants
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElem = document.getElementById('score');
        const restartBtn = document.getElementById('restartBtn');
        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;

        // Bird
        const bird = {
            x: 80,
            y: HEIGHT / 2,
            radius: 22,
            velocity: 0,
            gravity: 0.5,
            jump: -8,
            rotation: 0,
            alive: true
        };

        // Pipes
        const pipes = [];
        const PIPE_WIDTH = 70;
        const PIPE_GAP = 160;
        const PIPE_INTERVAL = 1400; // ms
        let lastPipeTime = 0;

        // Ground
        const GROUND_HEIGHT = 80;

        // Game state
        let score = 0;
        let highScore = 0;
        let gameOver = false;
        let started = false;

        // Bird sprite colors
        const birdColors = ['#ffe066', '#f9c74f', '#f9844a'];
        const wingColor = '#fff';
        const beakColor = '#ffb703';
        const eyeColor = '#222';

        // Draw background clouds
        function drawClouds() {
            ctx.save();
            ctx.globalAlpha = 0.25;
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(80 + i*120, 100 + Math.sin(Date.now()/1000 + i)*10, 40, 0, Math.PI*2);
                ctx.arc(120 + i*120, 110 + Math.cos(Date.now()/1200 + i)*10, 30, 0, Math.PI*2);
                ctx.arc(100 + i*120, 120 + Math.sin(Date.now()/900 + i)*10, 25, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();
        }

        // Draw ground
        function drawGround() {
            ctx.save();
            ctx.fillStyle = '#e0ac69';
            ctx.fillRect(0, HEIGHT - GROUND_HEIGHT, WIDTH, GROUND_HEIGHT);
            // Add grass
            ctx.fillStyle = '#7ec850';
            for (let i = 0; i < WIDTH; i += 20) {
                ctx.beginPath();
                ctx.arc(i + 10, HEIGHT - GROUND_HEIGHT, 16, 0, Math.PI, true);
                ctx.fill();
            }
            ctx.restore();
        }

        // Draw bird
        function drawBird() {
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.rotation);

            // Body
            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = birdColors[score % birdColors.length];
            ctx.shadowColor = '#333';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Wing
            ctx.save();
            ctx.rotate(Math.sin(Date.now()/100) * 0.2);
            ctx.beginPath();
            ctx.ellipse(-8, 8, 12, 6, Math.PI/4, 0, Math.PI*2);
            ctx.fillStyle = wingColor;
            ctx.globalAlpha = 0.8;
            ctx.fill();
            ctx.restore();

            // Beak
            ctx.beginPath();
            ctx.moveTo(bird.radius-2, -6);
            ctx.lineTo(bird.radius+14, 0);
            ctx.lineTo(bird.radius-2, 6);
            ctx.closePath();
            ctx.fillStyle = beakColor;
            ctx.fill();

            // Eye
            ctx.beginPath();
            ctx.arc(10, -8, 5, 0, Math.PI*2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(12, -8, 2, 0, Math.PI*2);
            ctx.fillStyle = eyeColor;
            ctx.fill();

            ctx.restore();
        }

        // Draw pipes
        function drawPipes() {
            pipes.forEach(pipe => {
                // Top pipe
                ctx.save();
                ctx.fillStyle = '#4caf50';
                ctx.strokeStyle = '#388e3c';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.rect(pipe.x, 0, PIPE_WIDTH, pipe.top);
                ctx.fill();
                ctx.stroke();
                // Top pipe cap
                ctx.fillStyle = '#81c784';
                ctx.fillRect(pipe.x-4, pipe.top-20, PIPE_WIDTH+8, 20);
                ctx.restore();

                // Bottom pipe
                ctx.save();
                ctx.fillStyle = '#4caf50';
                ctx.strokeStyle = '#388e3c';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.rect(pipe.x, pipe.bottom, PIPE_WIDTH, HEIGHT - pipe.bottom - GROUND_HEIGHT);
                ctx.fill();
                ctx.stroke();
                // Bottom pipe cap
                ctx.fillStyle = '#81c784';
                ctx.fillRect(pipe.x-4, pipe.bottom, PIPE_WIDTH+8, 20);
                ctx.restore();
            });
        }

        // Draw game over
        function drawGameOver() {
            ctx.save();
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = '#222';
            ctx.fillRect(40, HEIGHT/2-100, WIDTH-80, 180);
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 2.5em Segoe UI, Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', WIDTH/2, HEIGHT/2-40);
            ctx.font = '1.3em Segoe UI, Arial';
            ctx.fillStyle = '#ffe066';
            ctx.fillText('Score: ' + score, WIDTH/2, HEIGHT/2+10);
            ctx.fillStyle = '#fff';
            ctx.fillText('High Score: ' + highScore, WIDTH/2, HEIGHT/2+50);
            ctx.restore();
        }

        // Update bird physics
        function updateBird() {
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            bird.rotation = Math.min(Math.PI/2, bird.velocity/10);

            // Collision with ground
            if (bird.y + bird.radius > HEIGHT - GROUND_HEIGHT) {
                bird.y = HEIGHT - GROUND_HEIGHT - bird.radius;
                bird.velocity = 0;
                bird.alive = false;
                gameOver = true;
            }
            // Collision with ceiling
            if (bird.y - bird.radius < 0) {
                bird.y = bird.radius;
                bird.velocity = 0;
            }
        }

        // Update pipes
        function updatePipes(delta) {
            for (let i = pipes.length-1; i >= 0; i--) {
                pipes[i].x -= 2.5;
                // Remove off-screen pipes
                if (pipes[i].x + PIPE_WIDTH < 0) {
                    pipes.splice(i, 1);
                }
            }
            // Add new pipes
            if (Date.now() - lastPipeTime > PIPE_INTERVAL) {
                const top = Math.random() * (HEIGHT - PIPE_GAP - GROUND_HEIGHT - 120) + 40;
                pipes.push({
                    x: WIDTH,
                    top: top,
                    bottom: top + PIPE_GAP,
                    passed: false
                });
                lastPipeTime = Date.now();
            }
        }

        // Check collisions
        function checkCollisions() {
            pipes.forEach(pipe => {
                // Bird hit pipe
                if (
                    bird.x + bird.radius > pipe.x &&
                    bird.x - bird.radius < pipe.x + PIPE_WIDTH &&
                    (
                        bird.y - bird.radius < pipe.top ||
                        bird.y + bird.radius > pipe.bottom
                    )
                ) {
                    bird.alive = false;
                    gameOver = true;
                }
                // Score
                if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
                    score++;
                    pipe.passed = true;
                    scoreElem.textContent = score;
                }
            });
        }

        // Main game loop
        let lastTime = 0;
        function gameLoop(time) {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            drawClouds();
            drawPipes();
            drawGround();
            drawBird();

            if (started && !gameOver) {
                updateBird();
                updatePipes(time - lastTime);
                checkCollisions();
            }

            if (gameOver) {
                drawGameOver();
                restartBtn.style.display = 'block';
                if (score > highScore) {
                    highScore = score;
                }
            } else {
                restartBtn.style.display = 'none';
            }

            lastTime = time;
            requestAnimationFrame(gameLoop);
        }

        // Start game
        function startGame() {
            bird.y = HEIGHT / 2;
            bird.velocity = 0;
            bird.alive = true;
            bird.rotation = 0;
            pipes.length = 0;
            score = 0;
            scoreElem.textContent = score;
            gameOver = false;
            started = true;
            lastPipeTime = Date.now();
        }

        // Controls
        function flap() {
            if (!started) {
                startGame();
            }
            if (!gameOver) {
                bird.velocity = bird.jump;
            }
        }
        document.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                flap();
            }
        });
        canvas.addEventListener('mousedown', flap);
        canvas.addEventListener('touchstart', flap);

        restartBtn.addEventListener('click', () => {
            startGame();
        });

        // Responsive scaling
        function resizeCanvas() {
            let scale = Math.min(
                window.innerWidth / WIDTH,
                window.innerHeight / HEIGHT,
                1
            );
            gameContainer.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        const gameContainer = document.getElementById('gameContainer');
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Start loop
        gameLoop();
    </script>
</body>
</html>
